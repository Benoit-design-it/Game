<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Make No Promises</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Grain du papier -->
        <filter id="f-grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="g"/>
          <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 0 0.27  0 0 0 0.1 0"/>
        </filter>
        <!-- Trait de pinceau un peu irrégulier -->
        <filter id="f-brush" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
        </filter>
        <!-- Lavis enlevé : bords rongés -->
        <filter id="f-lift" x="-30%" y="-60%" width="160%" height="220%">
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="6" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
          <feGaussianBlur stdDeviation="0.8"/>
        </filter>
        <filter id="f-wash" x="-10%" y="-40%" width="120%" height="180%">
          <feGaussianBlur stdDeviation="10"/>
        </filter>
        <!-- Silhouettes : encre diluée qui bave dans le papier, séchée par les promesses. -->
        <filter id="f-visitor" x="-50%" y="-30%" width="200%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="11" result="noise">
            <animate attributeName="baseFrequency" dur="13s" values="0.022;0.027;0.022" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap id="f-visitor-disp" in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G" result="warped"/>
          <feGaussianBlur id="f-visitor-blur" in="warped" stdDeviation="6"/>
        </filter>
        <filter id="f-bleed" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>
        <filter id="f-wet" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
        <radialGradient id="g-vignette" gradientUnits="userSpaceOnUse" cx="500" cy="300" r="720">
          <stop offset="0.5" stop-color="#2a2620" stop-opacity="0"/>
          <stop offset="1" stop-color="#2a2620" stop-opacity="0.9"/>
        </radialGradient>
        <radialGradient id="g-presence" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fffdf6" stop-opacity="0.85"/>
          <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect x="-1500" y="-200" width="4000" height="1020" fill="#eee7d8"/>
      <rect x="-1500" y="-200" width="4000" height="1020" filter="url(#f-grain)" pointer-events="none"/>

      <!-- Vérités potentielles : un sceau par promesse. -->
      <g id="branches"></g>

      <!-- Sol : un lavis, et la marche du trône -->
      <rect x="-1500" y="492" width="4000" height="340" fill="#d6cdbb" filter="url(#f-wash)"/>
      <g filter="url(#f-brush)">
        <rect x="610" y="514" width="300" height="14" fill="#c3bba9" stroke="#1b1a17" stroke-width="1.6"/>
        <rect x="630" y="500" width="260" height="14" fill="#cfc7b6" stroke="#1b1a17" stroke-width="1.6"/>
      </g>

      <!-- Trône -->
      <g id="throne">
        <g filter="url(#f-brush)">
          <path d="M 690 470 L 690 190 Q 690 150 720 130 L 760 92 L 800 130 Q 830 150 830 190 L 830 470 Z" fill="#cfc7b6" stroke="#1b1a17" stroke-width="3.2" stroke-linejoin="round"/>
          <path d="M 705 400 L 705 200 Q 705 168 730 152 L 760 122 L 790 152 Q 815 168 815 200 L 815 400 Z" fill="#b7af9e"/>
        </g>
        <g id="cracks-back" class="cracks"></g>
      </g>

      <!-- Le protagoniste, assis. Sa silhouette sert aussi de modèle à la silhouette récurrente. -->
      <g id="protagonist" transform="translate(748 268)">
        <g id="protagonist-shape" filter="url(#f-brush)"></g>
      </g>

      <g id="throne-front">
        <g filter="url(#f-brush)">
          <rect x="670" y="400" width="180" height="34" fill="#a9a397" stroke="#1b1a17" stroke-width="2.4"/>
          <path d="M 675 434 L 845 434 L 855 500 L 665 500 Z" fill="#c3bba9" stroke="#1b1a17" stroke-width="2.4"/>
          <path id="robe" d="M 712 404 L 808 404 L 802 496 L 718 496 Z" fill="#1b1a17"/>
          <rect x="648" y="350" width="52" height="16" fill="#1b1a17"/>
          <rect x="654" y="366" width="14" height="68" fill="#1b1a17"/>
          <rect x="820" y="350" width="52" height="16" fill="#1b1a17"/>
          <rect x="852" y="366" width="14" height="68" fill="#1b1a17"/>
        </g>
        <g id="protagonist-arm"></g>
        <g id="cracks-front" class="cracks"></g>
        <g id="chains"></g>
        <g id="run-marks"></g>
        <g id="avoid-marks"></g>
      </g>
      <g id="dust"></g>

      <!-- Le fil de promesse non refermée, visible dès l'ouverture. -->
      <path id="thread" d="" fill="none" stroke="#2f4a6d" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
      <circle id="knot" cx="668" cy="356" r="4" fill="#2f4a6d"/>

      <!-- La silhouette qui demande. -->
      <g id="visitor" tabindex="-1" aria-label="Silhouette" opacity="0">
        <g id="visitor-body" filter="url(#f-visitor)"></g>
        <g id="visitor-features"></g>
      </g>

      <circle id="presence" cx="760" cy="300" r="260" fill="url(#g-presence)" opacity="0" pointer-events="none"/>
      <rect id="vignette" x="-1500" y="-200" width="4000" height="1020" fill="url(#g-vignette)" opacity="0.3" pointer-events="none"/>
    </svg>

    <section id="panel" aria-live="polite">
      <div id="lines"></div>
      <div id="choices" role="group" aria-label="Réponses"></div>
      <button id="continue" type="button" aria-label="Continuer" hidden>…</button>
    </section>

    <div id="title-screen" class="overlay">
      <h1>Make No Promises</h1>
      <p class="hint">Avec le son, de préférence.</p>
      <div class="overlay-actions">
        <button id="btn-resume" type="button" hidden>Reprendre</button>
        <button id="btn-start" type="button">S'asseoir</button>
      </div>
      <p id="load-error" class="load-error" hidden>Le jeu n'a pas pu se charger. Si tu as ouvert <code>src/index.html</code>, les fichiers <code>content.js</code>, <code>audio.js</code>, <code>game.js</code> et <code>style.css</code> doivent être dans le même dossier. Le plus simple : ouvrir le fichier autonome <code>index.html</code> à la racine du projet.</p>
      <noscript><p class="load-error">Ce jeu a besoin de JavaScript.</p></noscript>
    </div>

    <div id="ending-screen" class="overlay" hidden>
      <h2 id="ending-title"></h2>
      <div id="ending-text"></div>
      <div class="overlay-actions">
        <button id="btn-again" type="button">Se rasseoir</button>
      </div>
    </div>

    <button id="btn-sound" type="button" aria-pressed="true">son</button>
    <pre id="debug" hidden></pre>
  </main>

  <script src="content.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script>
    // Si le jeu n'a pas démarré (fichier manquant, erreur), on le dit au lieu de laisser un bouton muet.
    if (!window.MNP) document.getElementById('load-error').hidden = false;
  </script>
</body>
</html>
