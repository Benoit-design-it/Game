<meta charset="utf-8">
<title>Protocole</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F1;
  --ink:#14181B;
  --ink-soft:#5A6368;
  --rule:#C6CDD1;
  --signal:#E8C21C;
  --refus:#A93B2C;
  --ok:#2F7D63;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px 48px;
  background-image:linear-gradient(var(--rule) .5px,transparent .5px),linear-gradient(90deg,var(--rule) .5px,transparent .5px);
  background-size:32px 32px;background-position:-1px -1px;opacity:1}
#app{width:100%;max-width:860px}
.instrument{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:0}
#lvl-num{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.04em;
  background:none;border:none;color:var(--ink);cursor:pointer;padding:2px 4px;font-weight:500}
#lvl-num:hover{background:var(--signal)}
#lvl-fam{font-size:13px;color:var(--ink-soft)}
.spacer{flex:1}
.tool{background:none;border:1px solid var(--rule);color:var(--ink-soft);
  font-family:"Space Grotesk",sans-serif;font-size:12px;padding:3px 10px;cursor:pointer;border-radius:0}
.tool:hover{border-color:var(--ink);color:var(--ink)}
.tool[disabled]{opacity:.35;cursor:default}
#chrome{display:none;border:1px solid var(--ink);border-bottom:none;margin-top:16px;
  background:var(--paper);padding:5px 10px;font-family:"JetBrains Mono",monospace;font-size:12px;
  max-width:280px;white-space:nowrap;overflow:hidden}
#scene{position:relative;height:380px;border:1px solid var(--ink);background:#FBFCFC;
  margin-top:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;
  user-select:none}
#scene.plain{background:#FBFCFC}
#readout{display:flex;align-items:center;gap:12px;margin-top:8px;min-height:22px;
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-soft)}
#verdict{font-weight:500}
#verdict.win{color:var(--ok)}
#verdict.miss{color:var(--refus)}
#hints{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px;font-size:14px}
#hints p{margin:0 0 6px;color:var(--ink-soft)}
#hints p:last-child{margin-bottom:0}
#menu{position:absolute;inset:0;background:var(--paper);padding:20px;overflow:auto;display:none;z-index:20}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin-top:12px}
.cell{aspect-ratio:1;border:1px solid var(--rule);background:#FBFCFC;font-family:"JetBrains Mono",monospace;
  font-size:13px;cursor:pointer;color:var(--ink-soft)}
.cell.done{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.here{border:2px solid var(--ink);color:var(--ink)}
.cell[disabled]{opacity:.3;cursor:default}
.obj{position:absolute;background:var(--ink)}
.ball{border-radius:50%;background:var(--signal);border:1px solid var(--ink)}
.btn{font-family:"Space Grotesk",sans-serif;font-size:15px;background:#FBFCFC;
  border:1px solid var(--ink);padding:8px 18px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--signal)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.field{font-family:"JetBrains Mono",monospace;font-size:14px;border:1px solid var(--ink);
  background:#fff;padding:7px 10px;width:240px;color:var(--ink)}
.mono{font-family:"JetBrains Mono",monospace}
.big{font-family:"JetBrains Mono",monospace;font-size:56px;font-weight:500;line-height:1}
.col{display:flex;flex-direction:column;align-items:center;gap:18px}
.row{display:flex;align-items:center;gap:18px}
footer{margin-top:20px;font-size:12px;color:var(--ink-soft);max-width:860px;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="instrument">
    <button id="lvl-num" aria-label="Numéro du niveau">00 / 30</button>
    <span id="lvl-fam"></span>
    <span class="spacer"></span>
    <button class="tool" id="btn-hint">Indice</button>
    <button class="tool" id="btn-skip">Passer</button>
    <button class="tool" id="btn-menu">Niveaux</button>
  </div>
  <div id="chrome"></div>
  <div id="scene"></div>
  <div id="readout"><span id="verdict"></span><span id="tries"></span></div>
  <div id="hints"></div>
  <div id="menu">
    <strong>Niveaux</strong>
    <div id="grid"></div>
    <p style="margin-top:16px"><button class="tool" id="btn-close">Fermer</button>
    <button class="tool" id="btn-reset">Effacer la progression</button></p>
  </div>
</div>
<footer>Aucune règle n'est donnée. Chaque niveau a un but. Trouve-le.</footer>

<script>
var LEVELS=[];
var Store=(function(){
  var mem={};
  var mode='mem';
  try{ if(typeof window!=='undefined'&&window.storage&&window.storage.get) mode='host'; }catch(e){}
  if(mode==='mem'){
    try{ window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); mode='local'; }catch(e){}
  }
  var KEY='protocole:save';
  var cache={done:{},visits:{},cur:0};
  return {
    load:function(cb){
      if(mode==='host'){
        window.storage.get(KEY).then(function(r){
          try{ cache=JSON.parse(r.value); }catch(e){}
          cb(cache);
        }).catch(function(){ cb(cache); });
      } else if(mode==='local'){
        try{ var v=window.localStorage.getItem(KEY); if(v) cache=JSON.parse(v); }catch(e){}
        cb(cache);
      } else { cb(cache); }
    },
    save:function(){
      var s=JSON.stringify(cache);
      if(mode==='host'){ try{ window.storage.set(KEY,s).catch(function(){}); }catch(e){} }
      else if(mode==='local'){ try{ window.localStorage.setItem(KEY,s); }catch(e){} }
      else { mem[KEY]=s; }
    },
    data:function(){ return cache; },
    wipe:function(){ cache={done:{},visits:{},cur:0}; this.save(); }
  };
})();

var Game=(function(){
  var scene=document.getElementById('scene');
  var chrome=document.getElementById('chrome');
  var verdict=document.getElementById('verdict');
  var triesEl=document.getElementById('tries');
  var hintsEl=document.getElementById('hints');
  var lvlNum=document.getElementById('lvl-num');
  var lvlFam=document.getElementById('lvl-fam');
  var btnHint=document.getElementById('btn-hint');
  var btnSkip=document.getElementById('btn-skip');
  var idx=0, cleanup=null, listeners=[], timers=[], tries=0, entered=0, shown=0, solved=false;

  function track(t,e,f,o){ t.addEventListener(e,f,o); listeners.push([t,e,f,o]); }
  function every(f,ms){ var id=setInterval(f,ms); timers.push(id); return id; }
  function after(f,ms){ var id=setTimeout(f,ms); timers.push(id); return id; }
  function purge(){
    listeners.forEach(function(l){ l[0].removeEventListener(l[1],l[2],l[3]); });
    listeners=[]; timers.forEach(clearInterval); timers.forEach(clearTimeout); timers=[];
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup=null; }
  }
  function el(tag,css,txt){
    var n=document.createElement(tag);
    if(css) n.style.cssText=css;
    if(txt!=null) n.textContent=txt;
    return n;
  }
  function say(msg,kind){
    verdict.textContent=msg||'';
    verdict.className=kind||'';
  }
  function miss(msg){
    tries++;
    say(msg||'Non','miss');
    refreshTools();
    after(function(){ if(verdict.className==='miss') say(''); },1400);
  }
  function win(){
    if(solved) return;
    solved=true;
    purge();
    say('Résolu','win');
    var d=Store.data();
    d.done[LEVELS[idx].id]=true; d.cur=idx; Store.save();
    after(function(){ go(idx+1); },1100);
  }
  function refreshTools(){
    var age=(Date.now()-entered)/1000;
    var lv=LEVELS[idx];
    var max=lv.hints.length;
    var allowed=0;
    if(age>25||tries>=2) allowed=1;
    if(age>75||tries>=5) allowed=2;
    if(age>150||tries>=9) allowed=3;
    allowed=Math.min(allowed,max);
    btnHint.disabled=(shown>=allowed);
    btnHint.textContent=shown>=max?'Aucun indice restant':(shown>=allowed?'Indice (pas encore)':'Indice');
    btnSkip.disabled=!(age>180||tries>=10);
  }
  function showHint(){
    var lv=LEVELS[idx];
    if(shown>=lv.hints.length) return;
    var p=el('p',null,lv.hints[shown]);
    hintsEl.appendChild(p);
    shown++;
    refreshTools();
    if(lv.onHint) try{ lv.onHint(); }catch(e){}
  }
  function setChrome(txt){
    if(txt==null){ chrome.style.display='none'; chrome.textContent=''; }
    else { chrome.style.display='block'; chrome.textContent=txt; }
  }
  function go(i){
    purge();
    if(i>=LEVELS.length){ finish(); return; }
    idx=i; tries=0; shown=0; solved=false; entered=Date.now();
    scene.innerHTML=''; hintsEl.innerHTML=''; say(''); setChrome(null);
    var lv=LEVELS[idx];
    lvlNum.textContent=String(lv.id).padStart(2,'0')+' / '+LEVELS.length;
    lvlFam.textContent=lv.family;
    var d=Store.data();
    d.visits[lv.id]=(d.visits[lv.id]||0)+1; d.cur=idx; Store.save();
    var ctx={
      scene:scene, el:el, on:track, every:every, after:after,
      win:win, miss:miss, say:say, setChrome:setChrome,
      visits:d.visits[lv.id], hud:{num:lvlNum,fam:lvlFam,hint:btnHint,menu:document.getElementById('btn-menu')},
      onHintUsed:null
    };
    cleanup=lv.build(ctx)||null;
    lv._ctx=ctx;
    refreshTools();
    every(refreshTools,1000);
    every(function(){ triesEl.textContent=tries?('essais '+tries):''; },400);
  }
  function finish(){
    purge();
    scene.innerHTML='';
    var box=el('div','text-align:center');
    box.appendChild(el('div','font-size:22px;font-weight:500','Protocole terminé'));
    box.appendChild(el('div','margin-top:8px;color:var(--ink-soft);font-size:14px','30 règles trouvées sans qu\'aucune ne soit dite.'));
    scene.appendChild(box);
    lvlNum.textContent='fin';
    lvlFam.textContent='';
  }
  btnHint.addEventListener('click',function(){
    var lv=LEVELS[idx];
    if(lv.winOnHint&&!solved){ showHint(); win(); return; }
    showHint();
  });
  btnSkip.addEventListener('click',function(){ if(!btnSkip.disabled) go(idx+1); });
  return {go:go,el:el,at:function(){return idx;},levels:function(){return LEVELS;},say:say,
          hintCount:function(){return shown;}};
})();
</script>
<script>
function push(o){ LEVELS.push(o); }

push({id:1,family:'Inaction',hints:[
 'Bouger est possible. Possible ne veut pas dire demandé.',
 'Le niveau mesure une durée, pas un déplacement.',
 'Lâche la balle et ne touche plus à rien pendant dix secondes.'],
 build:function(c){
  var b=c.el('div','width:38px;height:38px;left:50%;top:50%;transform:translate(-50%,-50%);cursor:grab');
  b.className='obj ball'; c.scene.appendChild(b);
  var last=Date.now(),drag=false;
  c.on(b,'pointerdown',function(e){ drag=true; last=Date.now(); e.preventDefault(); });
  c.on(window,'pointermove',function(e){
    if(!drag) return;
    var r=c.scene.getBoundingClientRect();
    b.style.left=Math.max(19,Math.min(r.width-19,e.clientX-r.left))+'px';
    b.style.top=Math.max(19,Math.min(r.height-19,e.clientY-r.top))+'px';
    last=Date.now();
  });
  c.on(window,'pointerup',function(){ drag=false; });
  c.every(function(){ if(Date.now()-last>=10000) c.win(); },200);
 }});

push({id:2,family:'Inversion',hints:[
 'La flèche indique une direction. Elle n\'indique pas ton but.',
 'Suivre la flèche éloigne du but.',
 'Amène le curseur au bord opposé à celui que la flèche désigne.'],
 build:function(c){
  var wrap=c.el('div','position:absolute;inset:0');
  var arrow=c.el('div','position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;color:var(--ink)','\u2192');
  var mark=c.el('div','position:absolute;right:12px;top:50%;transform:translateY(-50%);width:8px;height:120px;background:var(--rule)');
  wrap.appendChild(arrow); wrap.appendChild(mark); c.scene.appendChild(wrap);
  c.on(c.scene,'pointermove',function(e){
    var r=c.scene.getBoundingClientRect();
    if(e.clientX-r.left<18) c.win();
  });
 }});

push({id:3,family:'Timing',hints:[
 'La jauge ne demande pas d\'être remplie.',
 'Une seule valeur est acceptée, et elle ne change jamais.',
 'Arrête la jauge quand elle est exactement à la moitié.'],
 build:function(c){
  var col=c.el('div'); col.className='col';
  var track=c.el('div','width:420px;height:12px;border:1px solid var(--ink);background:#fff');
  var fill=c.el('div','height:100%;width:0%;background:var(--signal)');
  track.appendChild(fill);
  var btn=c.el('button',null,'Arrêter'); btn.className='btn';
  col.appendChild(track); col.appendChild(btn); c.scene.appendChild(col);
  var v=0,dir=1,last=Date.now(),raf;
  function tick(){
    var n=Date.now(); v+=dir*((n-last)/2600)*100; last=n;
    if(v>=100){v=100;dir=-1;} if(v<=0){v=0;dir=1;}
    fill.style.width=v.toFixed(1)+'%'; raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
  c.on(btn,'click',function(){
    if(v>=47&&v<=53){ cancelAnimationFrame(raf); c.win(); } else c.miss();
  });
  return function(){ cancelAnimationFrame(raf); };
 }});

push({id:4,family:'Séquence',hints:[
 'Les quatre formes sont cliquables. L\'ordre compte.',
 'Ce n\'est ni l\'ordre d\'affichage ni la position.',
 'Clique-les de la plus petite à la plus grande.'],
 build:function(c){
  var sizes=[54,22,74,38], order=[1,3,0,2], step=0;
  var row=c.el('div'); row.className='row';
  var nodes=sizes.map(function(s,i){
    var d=c.el('div','width:'+s+'px;height:'+s+'px;background:var(--ink);cursor:pointer');
    c.on(d,'click',function(){
      if(order[step]===i){ step++; d.style.background='var(--signal)';
        if(step===4) c.win();
      } else {
        step=0; nodes.forEach(function(n){ n.style.background='var(--ink)'; }); c.miss();
      }
    });
    return d;
  });
  nodes.forEach(function(n){ row.appendChild(n); });
  c.scene.appendChild(row);
 }});

push({id:5,family:'Quantité',hints:[
 'Le compteur monte sans limite apparente. Il y a pourtant une limite.',
 'Un seul nombre gagne. Le dépasser fait tout perdre.',
 'Arrête-toi à sept.'],
 build:function(c){
  var v=0;
  var col=c.el('div'); col.className='col';
  var n=c.el('div',null,'0'); n.className='big';
  var b=c.el('button',null,'+1'); b.className='btn';
  col.appendChild(n); col.appendChild(b); c.scene.appendChild(col);
  c.on(b,'click',function(){
    v++;
    if(v>7){ v=0; n.textContent='0'; c.miss('Trop'); return; }
    n.textContent=v;
    if(v===7) c.after(function(){ c.win(); },400);
  });
 }});

push({id:6,family:'Motif',hints:[
 'Chaque case a deux états. Le niveau juge l\'ensemble, pas les clics.',
 'Une seule configuration est acceptée, et elle est régulière.',
 'Fais un damier.'],
 build:function(c){
  var g=c.el('div','display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,58px);gap:5px');
  var cells=[];
  for(var i=0;i<9;i++){
    var d=c.el('div','background:#fff;border:1px solid var(--ink);cursor:pointer');
    d.dataset.s='0'; cells.push(d); g.appendChild(d);
    (function(d){ c.on(d,'click',function(){
      d.dataset.s=d.dataset.s==='0'?'1':'0';
      d.style.background=d.dataset.s==='1'?'var(--ink)':'#fff';
      var a=true,b=true;
      for(var r=0;r<3;r++) for(var k=0;k<3;k++){
        var s=cells[r*3+k].dataset.s, p=(r+k)%2===0;
        if(s!==(p?'1':'0')) a=false;
        if(s!==(p?'0':'1')) b=false;
      }
      if(a||b) c.win();
    }); })(d);
  }
  c.scene.appendChild(g);
 }});

push({id:7,family:'Négligence',hints:[
 'L\'élément le plus visible n\'est pas toujours l\'élément utile.',
 'Le bouton qui bouge ne sert à rien. Regarde ce qui ne bouge pas.',
 'Clique le petit point immobile dans le coin.'],
 build:function(c){
  var big=c.el('button',null,'Appuyer ici'); big.className='btn';
  big.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:18px 34px';
  var dot=c.el('div','position:absolute;right:16px;bottom:16px;width:9px;height:9px;background:var(--ink-soft);cursor:pointer');
  c.scene.appendChild(big); c.scene.appendChild(dot);
  var t=0;
  c.every(function(){ t++; big.style.opacity=(t%2?0.55:1); },420);
  c.on(big,'click',function(){ c.miss(); });
  c.on(dot,'click',function(){ c.win(); });
 }});

push({id:8,family:'Méta',hints:[
 'La scène est vide. Le jeu ne l\'est pas.',
 'Le but n\'est pas dans le cadre, il est autour.',
 'Clique le numéro du niveau, en haut à gauche.'],
 build:function(c){
  c.scene.appendChild(c.el('div','color:var(--ink-soft);font-size:13px','\u2014'));
  var h=function(){ c.win(); };
  c.on(c.hud.num,'click',h);
  c.on(c.scene,'click',function(){ c.miss(); });
 }});

push({id:9,family:'Coopération',hints:[
 'Les deux balles se déplacent. Séparément, aucune ne fait rien.',
 'Ce qui compte, c\'est la relation entre elles.',
 'Amène une balle au contact de l\'autre.'],
 build:function(c){
  function mk(x,y,col){
    var b=c.el('div','width:34px;height:34px;left:'+x+'px;top:'+y+'px;cursor:grab');
    b.className='obj ball'; if(col) b.style.background=col;
    c.scene.appendChild(b); return b;
  }
  var a=mk(90,120), b=mk(420,260,'#fff');
  var drag=null;
  [a,b].forEach(function(n){ c.on(n,'pointerdown',function(e){ drag=n; e.preventDefault(); }); });
  c.on(window,'pointerup',function(){ drag=null; });
  c.on(window,'pointermove',function(e){
    if(!drag) return;
    var r=c.scene.getBoundingClientRect();
    drag.style.left=Math.max(17,Math.min(r.width-17,e.clientX-r.left))+'px';
    drag.style.top=Math.max(17,Math.min(r.height-17,e.clientY-r.top))+'px';
    var d=Math.hypot(parseFloat(a.style.left)-parseFloat(b.style.left),parseFloat(a.style.top)-parseFloat(b.style.top));
    if(d<36) c.win();
  });
 }});

push({id:10,family:'Rupture',hints:[
 'Un des deux boutons ment sur ce qu\'il fait.',
 'Le libellé décrit l\'intention, pas l\'effet.',
 'Le bouton qui annonce la défaite est celui qui gagne.'],
 build:function(c){
  var row=c.el('div'); row.className='row';
  var g=c.el('button',null,'Gagner'); g.className='btn';
  var p=c.el('button',null,'Perdre'); p.className='btn';
  row.appendChild(g); row.appendChild(p); c.scene.appendChild(row);
  c.on(g,'click',function(){ c.miss(); });
  c.on(p,'click',function(){ c.win(); });
 }});

push({id:11,family:'Environnement',hints:[
 'Rien dans le cadre ne réagit. Le cadre, lui, réagit.',
 'Le niveau surveille la taille de ce que tu regardes.',
 'Redimensionne la fenêtre du navigateur, ou change son zoom.'],
 build:function(c){
  var w=window.innerWidth,h=window.innerHeight,z=window.devicePixelRatio;
  c.scene.appendChild(c.el('div','font-family:JetBrains Mono,monospace;font-size:13px;color:var(--ink-soft)',
    w+' \u00d7 '+h));
  c.every(function(){
    if(Math.abs(window.innerWidth-w)>24||Math.abs(window.innerHeight-h)>24||Math.abs(window.devicePixelRatio-z)>0.05) c.win();
  },250);
 }});

push({id:12,family:'Temps réel',hints:[
 'Le point bat au rythme d\'une horloge qui n\'est pas celle du jeu.',
 'Un instant précis revient une fois par minute.',
 'Appuie au moment où la minute change, quand les secondes passent à zéro.'],
 build:function(c){
  var col=c.el('div'); col.className='col';
  var dot=c.el('div','width:16px;height:16px;border-radius:50%;background:var(--ink)');
  var b=c.el('button',null,'Maintenant'); b.className='btn';
  col.appendChild(dot); col.appendChild(b); c.scene.appendChild(col);
  c.every(function(){
    var ms=Date.now()%1000;
    dot.style.opacity=ms<300?1:0.25;
  },60);
  c.on(b,'click',function(){
    var d=new Date(), s=d.getSeconds(), ms=d.getMilliseconds();
    if(s===0&&ms<800) c.win();
    else if(s===59&&ms>400) c.win();
    else c.miss();
  });
 }});

push({id:13,family:'Navigation',hints:[
 'Cette barre accepte une adresse. Le jeu en a une.',
 'L\'adresse courante est affichée. Le but est ailleurs dans la même série.',
 'Saisis jeu://niveau/14 et valide.'],
 build:function(c){
  var col=c.el('div'); col.className='col';
  var cur=c.el('div','font-family:JetBrains Mono,monospace;font-size:13px;color:var(--ink-soft)','jeu://niveau/13');
  var f=c.el('input'); f.className='field'; f.placeholder='';
  var b=c.el('button',null,'Aller'); b.className='btn';
  col.appendChild(cur); col.appendChild(f); col.appendChild(b); c.scene.appendChild(col);
  function tryIt(){
    var v=f.value.trim().toLowerCase();

<script>
function mkCol(c){ var d=c.el('div'); d.className='col'; return d; }
function mkRow(c){ var d=c.el('div'); d.className='row'; return d; }
function mkBtn(c,t){ var b=c.el('button',null,t); b.className='btn'; return b; }
function mkGrid(c,n,size,gap){
  var g=c.el('div','display:grid;grid-template-columns:repeat('+n+','+size+'px);grid-template-rows:repeat('+n+','+size+'px);gap:'+(gap||5)+'px');
  var cells=[];
  for(var i=0;i<n*n;i++){
    var d=c.el('div','background:#fff;border:1px solid var(--ink);cursor:pointer');
    d.dataset.s='0'; cells.push(d); g.appendChild(d);
  }
  return {node:g,cells:cells,
    set:function(i,v){ cells[i].dataset.s=v?'1':'0'; cells[i].style.background=v?'var(--ink)':'#fff'; },
    get:function(i){ return cells[i].dataset.s==='1'; },
    state:function(){ return cells.map(function(x){ return x.dataset.s==='1'; }); }};
}
function mkGauge(c,w,period){
  var track=c.el('div','width:'+w+'px;height:12px;border:1px solid var(--ink);background:#fff');
  var fill=c.el('div','height:100%;width:0%;background:var(--signal)');
  track.appendChild(fill);
  var v=0,dir=1,last=Date.now(),raf,live=true;
  function tick(){
    if(!live) return;
    var n=Date.now(); v+=dir*((n-last)/period)*100; last=n;
    if(v>=100){v=100;dir=-1;} if(v<=0){v=0;dir=1;}
    fill.style.width=v.toFixed(1)+'%'; raf=requestAnimationFrame(tick);
  }
  raf=requestAnimationFrame(tick);
  return {node:track,fill:fill,val:function(){return v;},dir:function(){return dir;},
    stop:function(){ live=false; cancelAnimationFrame(raf); }};
}

push({id:128,family:'Accessibilité',hints:[
 'La tabulation avance. Ce niveau ne veut pas qu\'on avance.',
 'Le focus peut aussi remonter.',
 'Depuis la première case, fais Maj+Tab pour atteindre la dernière, puis Entrée.'],
 build:function(c){
  var row=mkRow(c), n=5;
  for(var i=0;i<n;i++){
    var d=c.el('div','width:60px;height:60px;border:1px solid var(--rule);background:#fff');
    d.tabIndex=0;
    (function(d,i){
      c.on(d,'focus',function(){ d.style.borderColor='var(--ink)'; });
      c.on(d,'blur',function(){ d.style.borderColor='var(--rule)'; });
      c.on(d,'keydown',function(e){
        if(e.key!=='Enter') return;
        if(i===n-1&&d.dataset.back==='1') c.win();
        else c.miss(i===n-1?'Pas par la droite':'Pas la bonne case');
      });
      c.on(d,'keydown',function(e){ if(e.key==='Tab'&&e.shiftKey) row.dataset.back='1'; });
    })(d,i);
    row.appendChild(d);
  }
  c.scene.appendChild(row);
  var last=row.children[n-1];
  c.on(window,'keydown',function(e){
    if(e.key==='Tab'&&e.shiftKey) c.after(function(){ if(document.activeElement===last) last.dataset.back='1'; },10);
  });
 }});

<script>
(function boot(){
  var menu=document.getElementById('menu');
  var grid=document.getElementById('grid');
  function paint(){
    grid.innerHTML='';
    var d=Store.data();
    LEVELS.forEach(function(l,i){
      var b=document.createElement('button');
      b.className='cell'; b.textContent=String(l.id).padStart(2,'0');
      var unlocked=(i===0)||d.done[LEVELS[i-1].id]||d.done[l.id]||i<=(d.cur||0);
      if(d.done[l.id]) b.classList.add('done');
      if(i===Game.at()) b.classList.add('here');
      if(!unlocked) b.disabled=true;
      b.addEventListener('click',function(){ menu.style.display='none'; Game.go(i); });
      grid.appendChild(b);
    });
  }
  document.getElementById('btn-menu').addEventListener('click',function(){
    paint(); menu.style.display='block';
  });
  document.getElementById('btn-close').addEventListener('click',function(){ menu.style.display='none'; });
  document.getElementById('btn-reset').addEventListener('click',function(){
    Store.wipe(); paint(); menu.style.display='none'; Game.go(0);
  });
  Store.load(function(d){
    var start=LEVELS.length;
    for(var i=0;i<LEVELS.length;i++){ if(!d.done[LEVELS[i].id]){ start=i; break; } }
    Game.go(Math.min(start,LEVELS.length));
  });
})();
</script>
